<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeeMercado assets</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F0;--card:#FFFFFF;--text:#1E1A14;--muted:#4A4036;--accent:#8A3E14;--line:#D9CFC0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:40px 16px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.2}
h1{font-size:2.2rem;margin:0 0 8px}
h2{font-size:1.5rem;margin:40px 0 16px}
p{margin:0 0 16px;color:var(--muted)}
a{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card img{display:block;width:100%;height:160px;object-fit:contain;background:var(--bg);border-radius:8px;margin-bottom:12px}
.name{font-weight:700;color:var(--text);word-break:break-all}
code{display:block;font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0;word-break:break-all;color:var(--text)}
button{font:inherit;font-size:16px;font-weight:700;background:var(--accent);color:#FFFFFF;border:0;border-radius:999px;padding:8px 18px;cursor:pointer;min-height:44px}
button:focus-visible,a:focus-visible{outline:3px solid var(--text);outline-offset:2px}
footer{margin-top:48px;font-size:16px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>VeeMercado assets</h1>
<p>Public files for veemercado.com, client proposals and email signatures. Copy a link and paste it wherever you need the file.</p>

<h2>Logos</h2>
<div class="grid" id="logos"></div>

<footer>Vee Mercado · <a href="https://veemercado.com">veemercado.com</a></footer>
</main>
<script>
var base = location.origin + "/";
var files = [
  {path:"Logos/veemercado_full_logo_light.png", label:"Full logo, light"},
  {path:"Logos/veemercado_logo_light.png", label:"Logo mark, light"}
];
var grid = document.getElementById("logos");
files.forEach(function(f){
  var url = base + f.path;
  var card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<img src="' + f.path + '" alt="' + f.label + '">' +
    '<div class="name">' + f.label + '</div>' +
    '<code>' + url + '</code>' +
    '<button type="button">Copy link</button> ' +
    '<a href="' + f.path + '" download>Download</a>';
  var btn = card.querySelector("button");
  btn.addEventListener("click", function(){
    navigator.clipboard.writeText(url).then(function(){
      btn.textContent = "Copied";
      setTimeout(function(){ btn.textContent = "Copy link"; }, 1500);
    });
  });
  grid.appendChild(card);
});
</script>
</body>
</html>
